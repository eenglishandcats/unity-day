/* Layout: one phone-width column of soft rounded cards; exam (lavender, 2026) and dream of 1612 (warm cream + pink), joined by a sleepy dream transition */
:root{
  color-scheme: light;
  --lav:#D9C4EF; --lav-soft:#EFE6F8; --pink:#F9CFE0; --pink-soft:#FDEEF4; --violet:#8B5FBF; --lilac:#CE6FAC; --ink:#4A2D6B; --ink-soft:#7D6597; --cream:#F2EDE4; --paper:#FFFCF8; --rec:#E05A8A; --mint:#5FA88E;
  --f-head:"Lazy Dog", "Pangolin", "Comic Sans MS", cursive;
  --f-body:"Nunito", "Segoe UI", Arial, sans-serif;
  --r:24px; --shadow:0 10px 28px rgba(74,45,107,.12), 0 2px 6px rgba(74,45,107,.06);
}
*{box-sizing:border-box}
body{background:var(--lav-soft); color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.5; transition:background-color .5s}
body.w1612{background:var(--cream)}
.wrap{max-width:540px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:16px 44px}
.stack{display:flex; flex-direction:column; gap:16px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--violet); outline-offset:3px}
p{margin:0}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:400}

.topline{display:flex; justify-content:space-between; gap:8px; font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
.card{background:var(--paper); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.card-bar{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 18px; background:var(--lav); font-size:13px; font-weight:700}
.w1612 .card-bar{background:var(--pink)}
.rec{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--rec); margin-right:7px; vertical-align:0; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.card-body{padding:18px; display:flex; flex-direction:column; gap:16px}
.btn{display:block; width:100%; text-align:center; font-weight:800; font-size:18px; padding:15px 18px; border-radius:999px; border:0; background:var(--violet); color:#fff; box-shadow:0 6px 16px rgba(139,95,191,.35); transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(139,95,191,.42)}
.btn:active{transform:translateY(1px)}
.btn.pinkish{background:var(--lilac); box-shadow:0 6px 16px rgba(206,111,172,.35)}
.btn.soft{background:var(--lav-soft); color:var(--violet); box-shadow:none}
.label{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft)}

/* intro */
.hero{display:flex; flex-direction:column; gap:2px; padding-top:6px}
.hero .t1{font-size:15px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--violet)}
.hero .t2{font:400 clamp(46px, 13vw, 62px)/1 var(--f-head); color:var(--lilac)}
.duo{display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:6px; background:linear-gradient(180deg, var(--lav-soft), var(--pink-soft)); border-radius:18px; padding:12px 12px 0}
.duo svg,.duo img{width:100%; height:auto; display:block; max-height:220px}
.duo img{margin-bottom:8px}
.duo .vs{font:400 20px var(--f-head); color:var(--violet); padding-bottom:40px}
.meta{display:flex; flex-wrap:wrap; gap:8px}
.meta span{background:var(--lav-soft); color:var(--violet); font-size:15px; font-weight:700; padding:5px 12px; border-radius:999px}

/* exam */
.cam-row{display:grid; grid-template-columns:100px 1fr; gap:14px; align-items:center}
.cam{position:relative; border-radius:16px; overflow:hidden; background:linear-gradient(180deg,#5b4677,#3e2c58); aspect-ratio:1/1; max-width:100%}
.cam svg{display:block; width:84%; height:auto; margin:14% auto 0}
.cam-label{position:absolute; left:8px; top:6px; font-size:10px; font-weight:800; color:#fff; opacity:.8; letter-spacing:.06em}
.task-note{font-size:16px; color:var(--ink-soft); min-width:0}
.qnum{font-size:13px; font-weight:800; color:var(--lilac); letter-spacing:.06em; text-transform:uppercase}
.q{font:400 30px/1.2 var(--f-head); color:var(--ink)}
.timer{display:flex; flex-direction:column; gap:8px}
.timer-top{display:flex; justify-content:space-between; font-size:14px; color:var(--ink-soft); font-weight:600}
.timer-top b{color:var(--violet); font-variant-numeric:tabular-nums}
.timer-track{height:10px; background:var(--lav-soft); border-radius:999px; overflow:hidden}
.timer-fill{height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg, var(--violet), var(--lilac))}
.timer.low .timer-fill{background:var(--rec)}
.timer.low b{color:var(--rec)}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start; text-align:left; background:var(--paper); border:2px solid var(--lav-soft); border-radius:18px; padding:14px 16px; font-size:17px; line-height:1.45; transition:border-color .15s, background .15s, transform .15s}
.opt:hover{border-color:var(--lav); background:#FBF8FE; transform:translateY(-1px)}
.opt-k{width:30px; height:30px; border-radius:50%; background:var(--lav); color:var(--ink); display:grid; place-items:center; font-weight:800; font-size:14px}
.said{font-size:17px; padding:12px 14px; border-radius:16px; background:var(--lav-soft)}
.said.ok{background:#E6F4EE}
.said.no{background:var(--pink-soft)}
.chip{display:inline-block; font-size:14px; font-weight:800; padding:5px 14px; border-radius:999px; color:#fff; background:var(--rec)}
.chip.ok{background:var(--mint)}
.react{display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:center}
.sonya{width:100%; height:auto; display:block}
.react .sonya{width:120px}
.bubble{position:relative; background:var(--lav-soft); border-radius:20px 20px 20px 6px; padding:12px 14px; font-size:17px; min-width:0}
.bubble small{display:block; font-size:12px; font-weight:800; color:var(--violet); margin-bottom:3px}

/* 1612 */
.ch-head{display:flex; flex-direction:column; gap:2px; padding-top:4px}
.ch-num{font-size:13px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--violet)}
.ch-title{font:400 clamp(28px, 8vw, 36px)/1.15 var(--f-head); color:var(--lilac)}
.scene{line-height:0; background:var(--lav-soft)}
.scene svg{width:100%; height:auto; display:block}
.beat-text{font-size:20px; line-height:1.5; min-height:4.5em}
.say{background:var(--lav-soft); border-radius:20px 20px 20px 6px; padding:12px 16px; display:flex; flex-direction:column; gap:2px}
.say.pink{background:var(--pink-soft)}
.say{font-size:18px} .say .who{font:400 19px var(--f-head); color:var(--violet)}
.lchoices{display:flex; flex-direction:column; gap:10px}
.lch{text-align:left; background:var(--paper); border:2px solid var(--pink); border-radius:18px; padding:14px 16px; font-size:17px; line-height:1.4; transition:background .15s, transform .15s}
.lch:hover{background:var(--pink-soft); transform:translateY(-1px)}
.outcome{display:flex; flex-direction:column; gap:14px}
.mark{font-size:14px; font-weight:800; display:inline-block; padding:5px 14px; border-radius:999px; align-self:flex-start; color:#fff}
.mark.ok{background:var(--mint)}
.mark.no{background:var(--rec)}
.fact{background:var(--cream); border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.fact{font-size:17px} .fact-head{display:grid; grid-template-columns:78px 1fr; gap:10px; align-items:center}
.fact-head svg{width:78px; height:auto}
.checker{display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:center; font-size:16px; color:var(--ink-soft)}
.checker svg{width:72px; height:auto}
.fact h3{font:400 22px var(--f-head); color:var(--lilac)}
.year{font:400 44px/1 var(--f-head); color:var(--violet)}
.dots{display:flex; gap:6px; justify-content:center}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--lav)}
.dots i.on{background:var(--lilac); width:22px; border-radius:999px}
.tapnext{align-self:flex-end; background:var(--pink-soft); color:var(--lilac); border:0; border-radius:999px; padding:10px 20px; font-weight:800; font-size:17px}
.words{display:flex; flex-direction:column; gap:6px}
.w{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:14px; background:var(--lav-soft); font-size:17px}
.w b{color:var(--violet)}
.w span{color:var(--ink-soft); text-align:right}

/* result */
.gramota{position:relative; border-radius:28px; padding:22px 18px 22px; background:linear-gradient(170deg, var(--lav) 0%, var(--pink) 100%); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
.g-kicker{font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--violet)}
.g-title{font:400 clamp(32px, 9.5vw, 42px)/1.1 var(--f-head); color:var(--ink)}
.g-fig{background:rgba(255,252,248,.6); border-radius:50%; width:170px; height:170px; display:grid; place-items:center; overflow:hidden}
.g-fig svg{width:136px; height:auto; margin-top:20px}
.g-sonya{display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center; text-align:left; background:rgba(255,252,248,.7); border-radius:18px; padding:10px 12px; font-size:16px}
.g-sonya img{width:96px; height:auto}
.g-desc{font-size:18px; max-width:38ch}
.g-score{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.g-score span{background:var(--paper); border-radius:999px; padding:5px 14px; font-size:14px; font-weight:700}
.g-score b{color:var(--violet); font-variant-numeric:tabular-nums}
.seal{position:absolute; right:14px; top:14px; width:56px; height:56px; border-radius:50%; background:var(--lilac); color:#fff; display:grid; place-items:center; font:400 16px var(--f-head); transform:rotate(-12deg); box-shadow:0 0 0 4px rgba(255,255,255,.55)}
.sp-item{display:flex; flex-direction:column; gap:5px; padding:14px 16px; border-radius:18px; background:var(--lav-soft)}
.sp-q{font-size:13px; font-weight:800; color:var(--lilac)}
.sp-a{font-size:17px; font-weight:600}
.sp-ru{font-size:15px; color:var(--ink-soft)}
.note{font-size:16px; color:var(--ink-soft); background:var(--pink-soft); border-radius:16px; padding:12px 14px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}

/* glitch transition */
#glitch{position:fixed; inset:0; z-index:50; background:#0f1318; color:#e9e2cf; display:grid; place-items:center; padding:24px; text-align:center}
#glitch[hidden]{display:none}
#glitch::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px); pointer-events:none}
.g-line{font:700 16px "PT Mono", "Courier New", monospace; letter-spacing:.12em; text-transform:uppercase; animation:jit .12s steps(2) infinite}
.g-years{font:400 48px/1.2 var(--f-head); color:#e2574c; margin-top:10px; animation:jit .2s steps(2) infinite reverse}
@keyframes jit{0%{transform:translate(0,0); text-shadow:2px 0 #2fa3ff,-2px 0 #ff3b3b} 50%{transform:translate(-3px,1px); text-shadow:-3px 0 #2fa3ff,3px 0 #ff3b3b} 100%{transform:translate(2px,-1px)}}
.fade-in{animation:fin .45s ease-out both}
@keyframes fin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  .rec,.g-line,.g-years,.fade-in{animation:none}
  body,.btn,.opt,.lch{transition:none}
}
</style>

</head>

      {t:'Взять штурмом Китай-город и держать осаду. Еда у них скоро кончится.', ok:1, r:'«Дельно!» Так и вышло: после штурма Китай-города голодный гарнизон в Кремле сдался через несколько дней.'},
      {t:'Позвать Наполеона.', ok:0, r:'«Опять ты со своим Наполеоном!» Пожарский закатывает глаза под шлемом.'},

    words:[['invaders','захватчики'],['liberation','освобождение'],['siege','осада']],

  { num:'Глава III', place:'Что было потом',

const MODEL = [
  {q:'What is the origin of Unity Day?', a:'Unity Day goes back to 1612. At that time Moscow was occupied by Polish-Lithuanian troops. People from different parts of Russia united and freed the city.', ru:'Праздник восходит к 1612 году: Москву заняли польско-литовские войска, люди из разных областей объединились и освободили город.'},
  {q:'What event does it commemorate?', a:'It commemorates the liberation of Moscow from foreign invaders in 1612. The people’s militia was led by Kuzma Minin and Prince Dmitry Pozharsky.', ru:'Освобождение Москвы от захватчиков в 1612 году. Народное ополчение вели Кузьма Минин и князь Дмитрий Пожарский.'},
  {q:'How is it celebrated in Russia, and how does your family celebrate it?', a:'People have a day off, there are concerts and festivals, and some people bring flowers to the monument to Minin and Pozharsky. My family usually spends this day together: we go for a walk and have a big family dinner.', ru:'Выходной, концерты, фестивали, цветы к памятнику. Моя семья проводит день вместе: гуляем и ужинаем всей семьёй.'}
];

const DIAG = [
  {min:0, t:'Гарнизон в Кремле', d:'Долго держал оборону молчанием, но сдался. Не беда: шпаргалка ниже — твоё личное ополчение.', f:()=>cfig('garr_lie')},
  {min:2, t:'Ополченец импровизации', d:'Нёс что-то бодрое и не всегда по теме. Энергия есть, фактов бы чуть-чуть.', f:()=>cfig('st_jump')},
  {min:4, t:'Кузьма Минин устной части', d:'Собрал знания по копейке и почти освободил аудиторию. Ещё один рывок.', f:()=>cfig('minin')},
  {min:6, t:'Князь Пожарский ЕГЭ', d:'Освободил аудиторию от позора. Сонечка хотела поставить тебе памятник, но регламент не разрешает.', f:()=>cfig('pozh')}
];

/* ================= state & flow ================= */
const FLOW = ['intro','q0','ch0','q1','ch1','ch2','q2','result'];
const DREAM = {
  'q0>ch0':['Сигнал потерян','2026 → 1612'],
  'ch0>q1':['Возврат в аудиторию','1612 → 2026'],
  'q1>ch1':['Снова плывёт','2026 → 1612'],
  'ch2>q2':['Просыпайся','2005 → 2026']
};
let S;
function fresh(){ return {pos:0, exam:[null,null,null], hist:[null,null,null], beat:[0,0,0], order:[shuffle([0,1,2,3]), shuffle([0,1,2,3]), shuffle([0,1,2,3])], chOrder:[shuffle([0,1,2,3]), shuffle([0,1,2,3]), shuffle([0,1,2,3])]}; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const world = st => st.startsWith('ch') ? '1612' : 'exam';
const examOpt = (qi, v) => v === 'timeout' ? TIMEOUT : EXAM[qi].opts[v];
const examScore = () => S.exam.reduce((n, v, i) => n + (v == null ? 0 : examOpt(i, v).ok), 0);
const histScore = () => S.hist.reduce((n, v, i) => n + (v == null ? 0 : CH[i].opts[v].ok), 0);

const app = document.getElementById('app');
let timer = null;
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

function render(){
  stopTimer();
  const st = FLOW[S.pos];
  document.body.classList.toggle('w1612', world(st) === '1612');
  let html = '';
  if (st === 'intro') html = introScreen();
  else if (st[0] === 'q') html = examScreen(+st[1]);
  else if (st.startsWith('ch')) html = chapterScreen(+st[2]);
  else html = resultScreen();
  app.innerHTML = `<div class="stack fade-in">${html}</div>`;
  if (st[0] === 'q' && S.exam[+st[1]] == null) startTimer(+st[1]);
}

function introScreen(){
  return `
  <div class="topline"><span>4 ноября</span><span>сон № 1612</span></div>
  <div class="hero"><span class="t1">Unity Day:</span><span class="t2">флешбэк</span></div>
  <section class="card">
    <div class="card-bar"><span><i class="rec"></i>Станция записи устных ответов</span><span>КИМ 1612</span></div>
    <div class="card-body">
      <div class="duo">${cfig('st_sus')}<span class="vs">vs</span>${sonya('mic')}</div>
      <p>Июнь 2026. Устная часть ЕГЭ. Ты (да, ты Стадик) надеваешь наушники, нажимаешь «Начать», и интервьюер спрашивает про День народного единства. Интервью берёт строгая кошка Сонечка, и микрофон уже у твоего лица.</p>
      <p>Сегодня 4 ноября, и тебе снова это снится. Только на этот раз сон унесёт тебя туда, где всё случилось.</p>
      <div class="meta"><span>3 вопроса</span><span>3 главы истории</span><span>≈ 4 минуты</span></div>
      <button class="btn" data-act="next">Начать запись</button>
    </div>
  </section>`;
}

function examScreen(qi){
  const q = EXAM[qi], ans = S.exam[qi];
  const camKey = ans == null ? 'st_sus' : (examOpt(qi, ans).ok ? 'st_jump' : 'st_cry');
  let body = '';
  if (ans == null){
    body = `
      <div class="timer" id="timer"><div class="timer-top"><span>Время на ответ</span><b id="tsec">0:40</b></div><div class="timer-track"><div class="timer-fill" id="tfill"></div></div></div>
      <p class="label">Что ты говоришь в микрофон</p>
      <div class="opts">${S.order[qi].map((id, k) => `<button class="opt" data-act="ans" data-i="${id}"><span class="opt-k">${'ABCD'[k]}</span><span>${q.opts[id].t}</span></button>`).join('')}</div>`;
  } else {
    const o = examOpt(qi, ans);
    const nextTxt = ['Что-то не так… всё плывёт →', 'Опять плывёт →', 'Узнать диагноз →'][qi];
    body = `
      <p class="label">Ты сказал</p>
      <p class="said ${o.ok ? 'ok' : 'no'}">${ans === 'timeout' ? o.t : '«' + o.t + '»'}</p>
      <div><span class="chip ${o.ok ? 'ok' : ''}">${o.ok ? '+1 балл' : '0 баллов'}</span></div>
      <div class="react">${sonya(o.mood)}<div class="bubble"><small>Наблюдатель Сонечка</small>${o.r}</div></div>
      <button class="btn" data-act="next">${nextTxt}</button>`;
  }
  return `
  <div class="topline"><span>ЕГЭ · Устная часть</span><span>Задание 3</span></div>
  <section class="card">
    <div class="card-bar"><span><i class="rec"></i>REC · Интервью</span><span>Вопрос ${qi + 1} из 3</span></div>
    <div class="card-body">
      <div class="cam-row">
        <div class="cam">${cfig(camKey, 'camfig')}<span class="cam-label">CAM 1</span></div>
        <p class="task-note">Ответь на вопрос интервьюера полными предложениями. На ответ — 40 секунд.</p>
      </div>
      <p class="qnum">Question ${qi + 1}</p>
      <h2 class="q">${q.q}</h2>
      ${body}
    </div>
  </section>`;
}

function startTimer(qi){
  const dur = 40000, t0 = performance.now();
  const fill = document.getElementById('tfill'), sec = document.getElementById('tsec'), box = document.getElementById('timer');
  timer = setInterval(() => {
    const left = Math.max(0, dur - (performance.now() - t0));
    const s = Math.ceil(left / 1000);
    if (fill) fill.style.width = (left / dur * 100) + '%';
    if (sec) sec.textContent = '0:' + String(s).padStart(2, '0');
    if (box) box.classList.toggle('low', s <= 10);
    if (left <= 0){ stopTimer(); S.exam[qi] = 'timeout'; render(); }
  }, 100);
}

function chapterScreen(ci){
  const c = CH[ci], ans = S.hist[ci];
  const items = c.narr ? c.narr.map(p => ({t:p})) : c.timeline.map(([y, t]) => ({y, t}));
  const pre = items.length, total = pre + 2;
  const b = Math.min(S.beat[ci] || 0, total - 1);
  let body = '';
  if (b < pre){
    const it = items[b];
    body = `${it.y ? `<p class="year">${it.y}</p>` : ''}<p class="beat-text">${it.t}</p><button class="tapnext" data-act="beat">Дальше ›</button>`;
  } else if (b === pre && ans == null){
    body = `<div class="say"><span class="who">${c.who}</span><p>${c.speech}</p></div>
      <div class="lchoices">${S.chOrder[ci].map(id => `<button class="lch" data-act="hist" data-i="${id}">${c.opts[id].t}</button>`).join('')}</div>`;
  } else if (b === pre){
    const o = c.opts[ans];
    body = `<span class="mark ${o.ok ? 'ok' : 'no'}">${o.ok ? 'В точку' : 'Мимо'}</span>
      <p class="beat-text">${o.r}</p>
      ${c.after ? `<div class="say pink"><span class="who">${c.after.who}</span><p>${c.after.t}</p></div>` : ''}
      <button class="tapnext" data-act="beat">Дальше ›</button>`;
  } else {
    body = `<div class="fact"><div class="fact-head">${cfig('hist_scroll')}<h3>${c.factTitle}</h3></div><p>${c.fact}</p></div>
      <div class="words"><p class="label">Слова для устной части</p>${c.words.map(([e, r]) => `<div class="w"><b>${e}</b><span>${r}</span></div>`).join('')}</div>
      <button class="btn pinkish" data-act="next">${c.next}</button>`;
  }
  const dots = Array.from({length: total}, (_, i) => `<i class="${i === b ? 'on' : ''}"></i>`).join('');
  return `
  <header class="ch-head"><p class="ch-num">${c.num}</p><h1 class="ch-title">${c.place}</h1></header>
  <section class="card">
    <div class="scene">${scene(ci, ans != null)}</div>
    <div class="card-body">
      <div class="dots" aria-hidden="true">${dots}</div>
      ${body}
    </div>
  </section>`;
}

function diagnosis(){ const total = examScore() + histScore(); let d = DIAG[0]; DIAG.forEach(x => { if (total >= x.min) d = x; }); return {d, total}; }
function shareText(){ const {d, total} = diagnosis(); return `Прошёл «Unity Day: флешбэк» — мой диагноз: «${d.t}» (${total}/6). А ты что ответишь экзаменатору про День народного единства?`; }
function shporaText(){ return MODEL.map((m, i) => `${i + 1}. ${m.q}\n${m.a}`).join('\n\n'); }

function resultScreen(){
  const {d, total} = diagnosis();
  return `
  <div class="topline"><span>Протокол сна</span><span>4 ноября</span></div>
  <div class="gramota">
    <div class="seal">1612</div>
    <p class="g-kicker">Твой диагноз</p>
    <h1 class="g-title">${d.t}</h1>
    <div class="g-fig">${d.f()}</div>
    <p class="g-desc">${d.d}</p>
    <div class="g-score"><span>Задание 3: <b>${examScore()} из 3</b></span><span>История: <b>${histScore()} из 3</b></span></div>
    <div class="g-sonya">${sonya(total >= 4 ? 'yay' : total >= 2 ? 'pleased' : 'cry')}<p>${total >= 4 ? 'Сонечка в восторге и уже рассказывает всем котам.' : total >= 2 ? 'Сонечка довольна, но шпаргалку всё-таки советует.' : 'Сонечка плачет. Срочно читай шпаргалку ниже.'}</p></div>
  </div>
  <button class="btn" data-act="copy" data-what="share">Скопировать результат для друга</button>
  <section class="card">
    <div class="card-bar"><span>Шпаргалка, если приснится снова</span><span>EN</span></div>
    <div class="card-body">
      ${MODEL.map(m => `<div class="sp-item"><p class="sp-q">${m.q}</p><p class="sp-a">${m.a}</p><p class="sp-ru">${m.ru}</p></div>`).join('')}
      <div class="checker">${cfig('rus_check')}<p>Ответы проверила строгая Кошка с русского. Говорит, придраться не к чему.</p></div>
      <p class="note">В задании 3 за каждый ответ ставят 0 или 1 балл. Нужны 2–3 полных предложения по теме вопроса. Если вопрос из двух частей, отвечай на обе.</p>
      <div class="row2">
        <button class="btn soft" data-act="copy" data-what="shpora">Скопировать ответы</button>
        <button class="btn soft" data-act="restart">Пройти ещё раз</button>
      </div>
    </div>
  </section>`;
}

/* ================= events ================= */
function dream(key, done){
  const g = DREAM[key];
  if (!g){ done(); return; }
  const box = document.getElementById('glitch');
  document.getElementById('g-line').textContent = g[0];
  document.getElementById('g-years').textContent = g[1];
  box.hidden = false;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { box.hidden = true; done(); }, reduce ? 600 : 1500);
}
function next(){
  const cur = FLOW[S.pos], nxt = FLOW[S.pos + 1];
  if (!nxt) return;
  const go = () => { S.pos++; render(); window.scrollTo(0, 0); };
  if (world(cur) !== world(nxt)) dream(cur + '>' + nxt, go); else go();
}
async function copy(text, btn){
  const old = btn.textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
    const ta = document.getElementById('copybox'); ta.value = text; ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) { ok = false; }
  }
  btn.textContent = ok ? 'Скопировано ✓' : 'Не вышло, выдели текст вручную';
  setTimeout(() => { btn.textContent = old; }, 2000);
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const st = FLOW[S.pos];
  if (act === 'next') next();
  else if (act === 'ans'){ stopTimer(); S.exam[+st[1]] = +b.dataset.i; render(); }
  else if (act === 'hist'){ S.hist[+st[2]] = +b.dataset.i; render(); }
  else if (act === 'beat'){ S.beat[+st[2]] = (S.beat[+st[2]] || 0) + 1; render(); }
  else if (act === 'copy') copy(b.dataset.what === 'share' ? shareText() : shporaText(), b);
  else if (act === 'restart'){ S = fresh(); render(); window.scrollTo(0, 0); }
});

/* ================= boot ================= */
function start(data){
  S = (data && data.S && Array.isArray(data.S.exam)) ? data.S : fresh();
  if (!S.beat) S.beat = [0,0,0];
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({S})); } catch(e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
